name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - name: Test setup wizard
        shell: pwsh
        run: ./scripts/test-setup.ps1

      - name: Build
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $ld = "-s -w -H windowsgui -X hyperhand/internal/proto.Version=$version"
          # The agent first: hyperhand.exe embeds it, so hyperhand.exe alone is the installer (winget).
          go build -trimpath -ldflags $ld -o dist/hyperhand-agent.exe ./cmd/hyperhand-agent
          Copy-Item dist/hyperhand-agent.exe cmd/hyperhand/embedded/hyperhand-agent.exe
          go build -trimpath -ldflags $ld -o dist/hyperhand.exe ./cmd/hyperhand
          Copy-Item dist/hyperhand.exe "hyperhand-$version-windows-amd64.exe"
          Copy-Item README.md, CHANGELOG.md dist/
          Compress-Archive -Path dist/* -DestinationPath "hyperhand-$version-windows-amd64.zip"
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build setup wizard
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" "/O$env:GITHUB_WORKSPACE" installer/hyperhand.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed: $LASTEXITCODE" }

      - name: Release notes
        shell: pwsh
        run: |
          # The CHANGELOG section of this version: from its "## [x.y.z]" heading to the next "## [" heading.
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($env:VERSION))\]" | Select-Object -First 1).LineNumber
          if ($start) {
            $rest = $lines[$start..($lines.Count - 1)]
            $end = ($rest | Select-String -Pattern '^## \[' | Select-Object -First 1).LineNumber
            $notes = if ($end) { $rest[0..($end - 2)] } else { $rest }
          } else {
            $notes = @("HyperHand $env:VERSION")
          }
          $notes | Set-Content notes.md

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "hyperhand-$env:VERSION-windows-amd64-setup.exe" "hyperhand-$env:VERSION-windows-amd64.zip" "hyperhand-$env:VERSION-windows-amd64.exe" --title "HyperHand $env:VERSION" --notes-file notes.md
